<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>စာအုပ်စင်</title>
    <style>
        body {
            font-family: 'Pyidaungsu', Arial, sans-serif;
            margin: 0;
            background-color: #FCFAED;
            color: #3E362E;
            padding-bottom: 80px; 
        }
        
        header {
            background: linear-gradient(135deg, #D4AF37, #E6C247);
            color: white;
            padding: 16px 20px;
            text-align: center;
            font-size: 19px;
            font-weight: bold;
            position: sticky;
            top: 0;
            box-shadow: 0 4px 6px rgba(212, 175, 55, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            z-index: 50;
        }
        
        #back-btn {
            position: absolute;
            left: 15px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        #book-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 20px 15px;
        }
        .book-item {
            background: white;
            padding: 15px 5px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            font-size: 14px;
            font-weight: bold;
            color: #4A3F35;
            text-align: center;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 90px;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }
        .book-item:active {
            border-color: #D4AF37;
            background-color: #FFF9E6;
            transform: scale(0.97);
        }

        #read-view {
            display: none;
            padding: 25px 20px;
            background: #FCFAED;
            min-height: 100vh;
        }
        #read-title {
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 15px;
            color: #B8860B;
            text-align: center;
        }
        #read-content {
            font-size: 16px;
            line-height: 1.9;
            color: #333;
            white-space: pre-wrap;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        /* App ပုံစံ Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: white;
            padding: 25px 20px;
            border-radius: 16px;
            width: 80%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-box h3 { margin-top: 0; color: #B8860B; font-size: 20px; }
        .modal-box p { color: #666; margin-bottom: 20px; line-height: 1.5; }
        
        .btn {
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            width: 45%;
        }
        .btn-update { background: #D4AF37; color: white; }
        .btn-cancel { background: #F0F0F0; color: #555; }

        /* အလယ်မှ ခုန်ဆွခုန်ဆွဖြစ်နေသော Update ခလုတ် (မူလက ဖျောက်ထားမည်) */
        .floating-update-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #D4AF37, #E6C247);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: none; /* အပ်ဒိတ်မရှိလျှင် ပျောက်နေမည် */
            justify-content: center;
            align-items: center;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            cursor: pointer;
            z-index: 100;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
            40% { transform: translateX(-50%) translateY(-15px); }
            60% { transform: translateX(-50%) translateY(-7px); }
        }
    </style>
</head>
<body>

    <header>
        <button id="back-btn" onclick="showListView()">❮</button>
        <span id="header-title">စာအုပ်စင်</span>
    </header>

    <!-- ခုန်ဆွခုန်ဆွ Update ခလုတ် (အသစ်ရှိမှသာ ပေါ်မည်) -->
    <div id="floating-btn" class="floating-update-btn" onclick="openUpdateModal()">
        🔄
    </div>

    <!-- ဗားရှင်းအသစ်ရှိလျှင် ပေါ်မည့် Box -->
    <div id="update-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>စာအုပ်အသစ်များ ရှိပါသည်</h3>
            <p>ပိုမိုကောင်းမွန်အောင် အပ်ဒိတ် လုပ်ပါ။</p>
            <button class="btn btn-update" onclick="applyUpdate()">ရယူမည်</button>
            <button class="btn btn-cancel" onclick="closeModal('update-modal')">နောက်မှ</button>
        </div>
    </div>

    <div id="book-list"></div>

    <div id="read-view">
        <h2 id="read-title"></h2>
        <div id="read-content"></div>
    </div>

    <script>
        const GITHUB_RAW_URL = "https://raw.githubusercontent.com/Ksovip/books-/refs/heads/main/books/book1.json";

        document.addEventListener("DOMContentLoaded", () => {
            loadBooksFromLocal();
            checkForUpdates(); // ဝင်ဝင်ချင်း အသံတိတ် စစ်ဆေးမည်
        });

        // နောက်ကွယ်မှ အပ်ဒိတ်ရှိ/မရှိ အလိုအလျောက် စစ်ဆေးခြင်း
        function checkForUpdates() {
            fetch(GITHUB_RAW_URL)
                .then(response => response.json())
                .then(data => {
                    const currentVersion = localStorage.getItem("app_version") || "0.0";
                    const newVersion = data.version;

                    // GitHub မှ Version က ပိုကြီးနေမှသာ ခလုတ်ပေါ်မည်
                    if (newVersion && parseFloat(newVersion) > parseFloat(currentVersion)) {
                        window.tempUpdateData = data; 
                        document.getElementById("floating-btn").style.display = "flex"; 
                    }
                })
                .catch(error => console.log("အင်တာနက်မရှိပါ။"));
        }

        // ခလုတ်နှိပ်မှ Box ပေါ်လာရန်
        function openUpdateModal() {
            document.getElementById("update-modal").style.display = "flex";
        }

        // အပ်ဒိတ်ကို လက်ခံပြီး သိမ်းဆည်းရန်
        function applyUpdate() {
            if (window.tempUpdateData) {
                localStorage.setItem("offline_books", JSON.stringify(window.tempUpdateData.books));
                localStorage.setItem("app_version", window.tempUpdateData.version); // နောက်ကွယ်မှာ မှတ်ထားမည်
                loadBooksFromLocal();
                closeModal('update-modal');
                document.getElementById("floating-btn").style.display = "none"; 
            }
        }

        function loadBooksFromLocal() {
            const listContainer = document.getElementById("book-list");
            listContainer.innerHTML = ""; 

            const savedData = localStorage.getItem("offline_books");
            
            if (savedData) {
                const books = JSON.parse(savedData);
                books.forEach(book => {
                    const itemDiv = document.createElement("div");
                    itemDiv.className = "book-item";
                    itemDiv.innerText = book.title;
                    itemDiv.onclick = () => showReadView(book.title, book.content);
                    listContainer.appendChild(itemDiv);
                });
            } else {
                listContainer.innerHTML = "<p style='grid-column: span 3; text-align:center; color: #888; margin-top:20px;'>စာအုပ်များ မရှိသေးပါ။ အင်တာနက်ဖွင့်ပြီး ခဏစောင့်ပါ။</p>";
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = "none";
        }

        function showReadView(title, content) {
            document.getElementById("book-list").style.display = "none";
            
            // စာဖတ်နေချိန် ခလုတ်ပေါ်နေခဲ့လျှင် ယာယီဖျောက်ထားမည်
            const isFloatingVisible = document.getElementById("floating-btn").style.display === "flex";
            if (isFloatingVisible) {
                document.getElementById("floating-btn").dataset.wasVisible = "true";
                document.getElementById("floating-btn").style.display = "none";
            }

            document.getElementById("read-view").style.display = "block";
            
            document.getElementById("read-title").innerText = title;
            document.getElementById("read-content").innerText = content;
            
            document.getElementById("header-title").innerText = "စာဖတ်ရန်";
            document.getElementById("back-btn").style.display = "flex";
            window.scrollTo(0, 0); 
        }

        function showListView() {
            document.getElementById("read-view").style.display = "none";
            document.getElementById("book-list").style.display = "grid";
            
            // စာဖတ်ပြီး ပြန်ထွက်လာလျှင် ခလုတ်ပေါ်သင့်ပါက ပြန်ဖော်မည်
            if (document.getElementById("floating-btn").dataset.wasVisible === "true") {
                document.getElementById("floating-btn").style.display = "flex";
                document.getElementById("floating-btn").dataset.wasVisible = "false";
            }
            
            document.getElementById("header-title").innerText = "စာအုပ်စင်";
            document.getElementById("back-btn").style.display = "none";
        }
    </script>
</body>
</html>
